name: image

# Pull-request build of the orchestrator image. Releases are published by the
# release workflow from a v* tag.
on:
  pull_request:
    paths:
      - images/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shock
            dockerfile: images/orchestrator/Dockerfile
          - name: shock-runner
            dockerfile: images/runner/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
