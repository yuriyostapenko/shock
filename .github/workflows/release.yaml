name: release

# One tag, three artifacts: the image ghcr.io/<owner>/shock:X.Y.Z, the chart
# oci://ghcr.io/<owner>/charts/shock:X.Y.Z with that image's digest pinned in
# its default values, and a GitHub Release carrying the chart archive.
# Tag pushes release by hand; release-claude.yaml calls this workflow for the
# automated Claude Code patch release, whose tag it creates first.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: X.Y.Z of the tag the caller has already created
        type: string
        required: true
      sha:
        description: Commit the tag points at
        type: string
        required: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  HELM_VERSION: v4.3.0

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_SHA: ${{ inputs.sha }}
        run: |
          if [[ -n "$IN_VERSION" ]]; then
            version="$IN_VERSION"; tag="v$version"; sha="$IN_SHA"; automated=true
          else
            tag="$GITHUB_REF_NAME"; version="${tag#v}"; sha="$GITHUB_SHA"; automated=false
          fi
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $tag is not vX.Y.Z or vX.Y.Z-prerelease" >&2; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "tag $tag does not point at a commit on main" >&2; exit 1
          fi
          # Patch numbers are reserved for the automated Claude Code bump
          # (CONTRIBUTING.md#releasing), so a hand-cut release bumps the minor.
          if [[ "$automated" == false && "${BASH_REMATCH[3]}" != 0 ]]; then
            echo "tag $tag: patch releases are cut by release-claude.yaml; release v${BASH_REMATCH[1]}.$(( BASH_REMATCH[2] + 1 )).0 instead" >&2; exit 1
          fi
          # Without a /vN module suffix Go stamps only major 0 or 1 tags as the version.
          if (( BASH_REMATCH[1] > 1 )); then
            echo "tag $tag: major versions above 1 need a /v${BASH_REMATCH[1]} module path suffix (go.mod) first" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  image:
    name: ${{ matrix.name }} ${{ needs.verify.outputs.version }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: shock
            dockerfile: images/orchestrator/Dockerfile
          - name: shock-runner
            dockerfile: images/runner/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ needs.verify.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign image (keyless)
        run: cosign sign --yes "ghcr.io/${{ needs.verify.outputs.owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
      # Build provenance: public repositories, or private on Enterprise Cloud.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.private == false
        with:
          subject-name: ghcr.io/${{ needs.verify.outputs.owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: record digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.name }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          if-no-files-found: error

  chart:
    name: chart ${{ needs.verify.outputs.version }}
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      ref: oci://ghcr.io/${{ needs.verify.outputs.owner }}/charts/shock
      image_digest: ${{ steps.pin.outputs.image_digest }}
      runner_digest: ${{ steps.pin.outputs.runner_digest }}
      claude: ${{ steps.pin.outputs.claude }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: pin the released images into the chart defaults
        id: pin
        env:
          OWNER: ${{ needs.verify.outputs.owner }}
        run: |
          IMAGE_DIGEST="$(cat digests/shock)"; RUNNER_DIGEST="$(cat digests/shock-runner)"
          export IMAGE_DIGEST RUNNER_DIGEST
          yq -i '.orchestrator.image.repository = "ghcr.io/" + strenv(OWNER) + "/shock" | .orchestrator.image.digest = strenv(IMAGE_DIGEST)
                 | .runner.image.repository = "ghcr.io/" + strenv(OWNER) + "/shock-runner" | .runner.image.digest = strenv(RUNNER_DIGEST)' charts/shock/values.yaml
          yq '{"orchestrator": .orchestrator.image, "runner": .runner.image}' charts/shock/values.yaml
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "runner_digest=$RUNNER_DIGEST" >> "$GITHUB_OUTPUT"
          echo "claude=$(yq -r '.annotations["shock.invalid/claude-code-version"]' charts/shock/Chart.yaml)" >> "$GITHUB_OUTPUT"
      - name: lint and package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          helm lint charts/shock -f test/values/minimal.yaml
          helm package charts/shock --version "$VERSION" --app-version "$VERSION" --destination dist
          ls -l dist
      - name: push chart to GHCR
        id: push
        env:
          OWNER: ${{ needs.verify.outputs.owner }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/shock-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign chart (keyless)
        run: cosign sign --yes "ghcr.io/${{ needs.verify.outputs.owner }}/charts/shock@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.private == false
        with:
          subject-name: ghcr.io/${{ needs.verify.outputs.owner }}/charts/shock
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: dist/shock-${{ needs.verify.outputs.version }}.tgz
          if-no-files-found: error

  release:
    name: github release ${{ needs.verify.outputs.version }}
    needs: [verify, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart
          path: dist
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          OWNER: ${{ needs.verify.outputs.owner }}
          IMAGE_DIGEST: ${{ needs.chart.outputs.image_digest }}
          RUNNER_DIGEST: ${{ needs.chart.outputs.runner_digest }}
          CHART_REF: ${{ needs.chart.outputs.ref }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
          CLAUDE_VERSION: ${{ needs.chart.outputs.claude }}
        run: |
          cat > notes.md <<NOTES
          Bundles Claude Code \`${CLAUDE_VERSION}\` in both images.

          ## Artifacts

          | Artifact | Reference | Digest |
          | --- | --- | --- |
          | Orchestrator image | \`ghcr.io/${OWNER}/shock:${VERSION}\` | \`${IMAGE_DIGEST}\` |
          | Default runner image | \`ghcr.io/${OWNER}/shock-runner:${VERSION}\` | \`${RUNNER_DIGEST}\` |
          | Chart | \`${CHART_REF}:${VERSION}\` | \`${CHART_DIGEST}\` |

          Install:

          \`\`\`sh
          helm install shock ${CHART_REF} --version ${VERSION} -n claude-runners \\
            --set environment.existingSecret=<secret>
          \`\`\`

          Verify (keyless signatures and build provenance):

          \`\`\`sh
          cosign verify ghcr.io/${OWNER}/shock@${IMAGE_DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://ghcr.io/${OWNER}/shock@${IMAGE_DIGEST} --repo ${GITHUB_REPOSITORY}
          \`\`\`
          NOTES
          flags=(--verify-tag --generate-notes --notes-file notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "v${VERSION}" "dist/shock-${VERSION}.tgz" --title "v${VERSION}" "${flags[@]}"
