name: update-claude

# Weekly pull request pinning images/*/Dockerfile to Anthropic's current
# Claude Code release. A PR opened with GITHUB_TOKEN does not trigger CI, so
# both images are built here first; set UPDATE_PR_TOKEN to have CI run too.
on:
  schedule:
    - cron: "0 6 * * 0"   # Sundays 06:00 UTC
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to follow
        type: choice
        options: [latest, stable]
        default: latest

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-claude
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
      CHANNEL: ${{ inputs.channel || 'latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
      - name: Resolve version
        id: bump
        run: |
          read -r old new < <(./hack/bump-claude.sh "$CHANNEL")
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$old" = "$new" ]; then
            echo "already at $old"
          elif gh pr list --head "chore/claude-$new" --state open --json number --jq 'length' | grep -qx 1; then
            echo "PR for $new already open"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4.3.0
        if: steps.bump.outputs.old != steps.bump.outputs.new && steps.bump.outputs.skip != 'true'
      - name: Build both images with the new pin
        if: steps.bump.outputs.old != steps.bump.outputs.new && steps.bump.outputs.skip != 'true'
        id: build
        run: |
          docker build -f images/orchestrator/Dockerfile -t shock:bump .
          docker build -f images/runner/Dockerfile -t shock-runner:bump .
          v="$(docker run --rm --entrypoint claude shock:bump --version)"
          echo "reported=$v" >> "$GITHUB_OUTPUT"
          echo "$v" | grep -q "${{ steps.bump.outputs.new }}"
      - name: Open pull request
        if: steps.bump.outputs.old != steps.bump.outputs.new && steps.bump.outputs.skip != 'true'
        env:
          OLD: ${{ steps.bump.outputs.old }}
          NEW: ${{ steps.bump.outputs.new }}
          REPORTED: ${{ steps.build.outputs.reported }}
        run: |
          branch="chore/claude-$NEW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add images/orchestrator/Dockerfile images/runner/Dockerfile
          git commit -m "chore: bump Claude Code to $NEW (from $OLD)"
          git push -u origin "$branch"
          cat > body.md <<EOF
          Pins both images to Claude Code **$NEW** (was $OLD), the \`$CHANNEL\` channel of Anthropic's release bucket.

          Both images were built in the workflow run; the orchestrator image reports \`$REPORTED\`.

          Changelog: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
          EOF
          gh pr create --base main --head "$branch" --title "chore: bump Claude Code to $NEW" --body-file body.md
