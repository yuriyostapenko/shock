# Default values for shock. See README.md for the runner image contract and
# operational notes. agent-sandbox (https://github.com/kubernetes-sigs/agent-sandbox)
# is a prerequisite installed separately from its upstream releases.

environment:
  # Name of an existing Secret with key `environment-secret` holding the
  # environment key from the Cloud environments admin page. Required unless
  # secretValue is set.
  existingSecret: ""
  # Inline value rendered into a chart-managed Secret. Prefer existingSecret;
  # values files with credentials tend to end up in git.
  secretValue: ""

orchestrator:
  image:
    repository: ghcr.io/yuriyostapenko/shock
    tag: ""          # defaults to the chart's appVersion, which the release sets to the same X.Y.Z
    digest: ""       # sha256:... pinned by the release workflow into the published chart
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  # Server-side spawn lease (p99 wake including the initial suspension
  # round-trip, session-controller latency, image pull and pod start).
  # All replicas share it. Range enforced by Anthropic: 10..3600.
  expectedSpawnSeconds: 180
  # Hook process budget. Template rendering fails unless hookTimeout + 5 < expectedSpawnSeconds.
  hookTimeout: 30
  hookConcurrency: 4
  # Pre-warm OFF by default. Standby runners are unbound: they never get a
  # per-session disk, so pre-warming only lowers cold-start latency for new sessions.
  minIdle: 0
  healthPort: 8080
  extraEnv: []       # e.g. HTTPS_PROXY / NO_PROXY for the orchestrator process
  extraArgs: []      # appended to the orchestrator command
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  # Defaults to preferred anti-affinity across nodes on the selector labels.
  affinity: {}
  priorityClassName: ""
  pdb:
    enabled: true
    minAvailable: 1

sessionController:
  resyncSeconds: 300
  gc:
    enabled: true
    maxIdle: 336h           # delete Sandbox + PVC + work-order Secrets after 14 days asleep
  zombie:
    enabled: true
    alertAfter: 5m          # alarm-only; the session controller never deletes Pods
  healthPort: 8080          # serves /metrics, /healthz and /readyz
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""

runner:
  image:
    repository: ghcr.io/yuriyostapenko/shock-runner   # the default runner image (README); build your own FROM it
    tag: ""          # defaults to the chart's appVersion
    digest: ""       # pinned by the release workflow into the published chart
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # The runner's --base-dir, where repositories are checked out. It must be
  # the PVC mount path (storage.mountPath) or a directory below it, and the
  # same on every runner in the environment: recorded absolute paths must
  # resolve on resume.
  baseDir: /home/runner/workspace
  runtimeClassName: ""    # e.g. kata, gvisor; empty = runc
  # Must cover the runner's SIGKILL floor: 75 s at defaults, 105 s with push-outcome.
  terminationGracePeriodSeconds: 120
  healthPort: 8080
  flags:
    releaseIdleSessionMin: 30
    killSessionAfterMin: 480
    exitIfUnusedMin: 10
    pushOutcomeOnRelease: true
    # Route git through api.anthropic.com with the session creator's claude.ai
    # GitHub connection, so the runner image carries no git credentials.
    # Requires capacity 1 and git >= 2.32, both true here. Set false when you
    # provide git credentials yourself (wrapper, checkout hook, image config).
    useAnthropicGitProxy: true
  # Appended to the rendered `claude self-hosted-runner` args, e.g.
  # ["--exec-path", "/opt/claude/wrapper.sh"] for the credentials wrapper.
  extraArgs: []
  # By default the image's entrypoint runs with the rendered args (the default
  # image and the deploy doc's recipe both end in claude). Set to replace the
  # command; `args` is then used verbatim and flags/extraArgs are ignored.
  command: []
  args: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  resources: {}
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: ["ALL"]
  # fsGroup lets a non-root runner write to a freshly provisioned PVC.
  podSecurityContext:
    fsGroup: 1000
  serviceAccountName: ""  # no token is ever mounted, whatever account is used
  # Set false to run the Pod in a user namespace (Kubernetes 1.36 GA; needs
  # containerd 2.0+/CRI-O 1.25+ and kernel 6.3+ with idmapped mounts). Root
  # inside the container is then an unprivileged host user, so `apt-get` works
  # in the default runner image with securityContext.runAsUser: 0 and
  # runAsNonRoot: false. Leave unset to keep the host user namespace.
  hostUsers: null
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podLabels: {}
  podAnnotations: {}
  storage:
    # Where the per-session PVC is mounted. The default is the runner user's
    # home, so everything a session installs or configures under ~ survives
    # sleep; baseDir lives inside it. Anything written there, including
    # credentials tools cache in dotfiles, stays on the disk until GC.
    mountPath: /home/runner
    className: ""
    size: 20Gi
    # Immutable after Sandbox creation: existing sessions keep the mode they
    # were born with. Decide before first install.
    accessMode: ReadWriteOncePod
  # Environment notes for Claude, mounted read-only at /etc/claude-code/CLAUDE.md
  # (Claude Code's managed-policy instructions, loaded into every session before
  # user and project CLAUDE.md files). Keep it short and concrete; an empty string
  # mounts nothing.
  instructions: |
    # This runner environment

    You are running in a Claude Code self-hosted runner managed by SHOCK.

    - Your home directory is a per-session persistent disk. The repository is
      checked out under `~/workspace/<owner>/<repo>`. Sessions sleep when idle
      and resume on the same disk: files, installed tools and caches under `~`
      are still there next time; running processes are not.
    - You have no root and no `sudo`; `apt-get` does not work. Install tooling
      in user space instead: `mise use -g node@22`, `mise use -g go@latest`,
      `mise use -g <tool>` for most CLIs, `uv python install 3.12`,
      `uv tool install <package>` or `uvx <package>` for Python tools. If a
      system library is missing, say so rather than trying to install it.
    - There is no Docker daemon in this environment.
    - Git reaches GitHub through Anthropic's proxy with the session creator's
      credentials. Push work to `claude/*` branches.
    - `/etc/claude-code` is read-only. Everything under `~` is yours to change.

  # Deep-merged over the rendered Sandbox podTemplate by Helm (maps merge,
  # lists replace). The hook then forces the template contract fields; see README.
  podTemplate: {}

network:
  # cilium: CiliumNetworkPolicy with toFQDNs. kubernetes: plain NetworkPolicy
  # without FQDN filtering (documented gap). none: render nothing.
  mode: cilium
  # host or host:port (443 default). One list for every runner egress
  # destination: Anthropic, git hosts, package registries or mirrors. Exact
  # names are preferred: enforceSNI applies to them only.
  # Anthropic's list: https://code.claude.com/docs/en/self-hosted-environments-deploy#network-requirements
  # The rest is what the default runner image's tooling (mise, uv, npm, dotnet)
  # fetches from; trim it for a different image or a mirror.
  allowedFQDNs:
    # Anthropic: control plane, inference, git proxy, plugin and docs lookups
    - api.anthropic.com
    - downloads.claude.ai
    - storage.googleapis.com
    - code.claude.com
    - claude.com
    # GitHub: clones without the git proxy, API lookups and release assets
    - github.com
    - api.github.com
    - codeload.github.com
    - raw.githubusercontent.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - github-releases.githubusercontent.com
    # mise: version and JVM metadata
    - mise.jdx.dev
    - mise-versions.jdx.dev
    - mise-java.jdx.dev
    # Node.js
    - nodejs.org
    - registry.npmjs.org
    # Python (uv, pip; CPython builds come from GitHub release assets)
    - pypi.org
    - files.pythonhosted.org
    - downloads.python.org
    # Go
    - go.dev
    - dl.google.com
    - proxy.golang.org
    - sum.golang.org
    # .NET SDKs and NuGet
    - builds.dotnet.microsoft.com
    - dotnet.microsoft.com
    - dot.net
    - api.nuget.org
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  metadataCIDR: 169.254.169.254/32
  # cilium mode: require the TLS handshake to name the allowed host (SNI) on
  # every exact allowedFQDNs entry. FQDN policy admits resolved addresses, and
  # CDN addresses are shared between customers; SNI enforcement keeps the allow
  # list a list of names. Wildcard entries are matched by address only.
  enforceSNI: true

monitoring:
  enabled: true
  podMonitor:
    interval: 30s
    labels: {}
    # Drops the `email` label (PII) from claude_code_self_hosted_runner_locked_account.
    dropEmailLabel: true
  prometheusRule:
    labels: {}
    sleepTransitionFor: 2m
