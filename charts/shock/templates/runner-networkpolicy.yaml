{{- $mode := .Values.network.mode -}}
{{- $n := .Values.network -}}
{{- $allFqdns := include "shock.fqdnEntries" . | fromJsonArray -}}
{{- $injected := include "shock.injectedCredentials" . | fromJsonArray -}}
{{- $injectedHosts := include "shock.injectedHosts" . | fromJson -}}
{{- /* An injected host carries its own interception rule on the runner policy;
       a plain L4 allow for the same destination would admit it unproxied. */ -}}
{{- $fqdns := list -}}
{{- range $allFqdns }}{{ if not (hasKey $injectedHosts .host) }}{{ $fqdns = append $fqdns . }}{{ end }}{{ end -}}
{{- $components := list "runner" "orchestrator" "session-controller" -}}
{{- if eq $mode "cilium" }}
{{- range $component := $components }}
{{- $labels := dict "root" $ "component" $component }}
---
# Default-deny egress for this release's {{ $component }} pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "shock.componentName" $labels }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "shock.labels" $labels | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "shock.selectorLabels" $labels | nindent 6 }}
  egressDeny:
    - toCIDR:
        - {{ $n.metadataCIDR }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $n.dns.namespace }}
            {{- range $k, $v := $n.dns.podLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    {{- if ne $component "runner" }}
    - toEntities:
        - kube-apiserver
    {{- end }}
    {{- if ne $component "session-controller" }}
    {{- range (eq $component "runner" | ternary $fqdns $allFqdns) }}
    - toFQDNs:
        {{- if contains "*" .pattern }}
        - matchPattern: {{ .pattern | quote }}
        {{- else }}
        - matchName: {{ .pattern | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ .port | quote }}
              protocol: TCP
          {{- /* SNI must match: CDN addresses are shared between customers. */}}
          {{- if $n.enforceSNI }}
          serverNames:
            - {{ .pattern | quote }}
          {{- end }}
    {{- end }}
    {{- if eq $component "runner" }}
    {{- range $injected }}
    {{- /* Secret injection (spec section 9): Cilium terminates TLS with the
           chart's certificate, REPLACEs the bound header from the Secret and
           re-originates to the real host. Nothing runs in the Pod. */}}
    - toFQDNs:
        - matchName: {{ .host | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          {{- if $n.enforceSNI }}
          serverNames:
            - {{ .host | quote }}
          {{- end }}
          {{- $terminating := include "shock.terminatingTLSSecret" $ | fromJson }}
          terminatingTLS:
            secret:
              namespace: {{ $terminating.namespace | quote }}
              name: {{ $terminating.name | quote }}
          {{- /* Mandatory: a rule without it lets Cilium forward the intercepted
                 request upstream in cleartext (spec section 9). */}}
          {{- $upstream := include "shock.upstreamCASecret" $ | fromJson }}
          originatingTLS:
            secret:
              namespace: {{ $upstream.namespace | quote }}
              name: {{ $upstream.name | quote }}
          rules:
            http:
              {{- $cred := . }}
              {{- $paths := .paths | default (list "") }}
              {{- $methods := .methods | default (list "") }}
              {{- range $p := $paths }}
              {{- range $m := $methods }}
              - {{ if $p }}path: {{ $p | quote }}
                {{ end }}{{ if $m }}method: {{ $m | quote }}
                {{ end }}headerMatches:
                  - name: {{ $cred.header | quote }}
                    mismatch: REPLACE
                    secret:
                      namespace: {{ $cred.secretNamespace | quote }}
                      name: {{ $cred.secretName | quote }}
              {{- end }}
              {{- end }}
              {{- if or $cred.paths $cred.methods }}
              {{- /* Requests outside the bound scope reach the host unmodified;
                     without this they would be dropped, not passed through. */}}
              - {}
              {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- else if eq $mode "kubernetes" }}
{{- $ports := list -}}
{{- range $allFqdns }}{{ if not (has .port $ports) }}{{ $ports = append $ports .port }}{{ end }}{{ end -}}
{{- range $component := $components }}
{{- $labels := dict "root" $ "component" $component }}
---
# Plain NetworkPolicy cannot filter by name: any address on the allowed ports
# except the metadata endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shock.componentName" $labels }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "shock.labels" $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shock.selectorLabels" $labels | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $n.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $n.dns.podLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ $n.metadataCIDR }}
      ports:
        {{- if eq $component "session-controller" }}
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        {{- else }}
        {{- range $ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
        {{- if eq $component "orchestrator" }}
        - port: 6443
          protocol: TCP
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
