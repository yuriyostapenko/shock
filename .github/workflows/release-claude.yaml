name: release-claude

# Daily pull request pinning both images to Anthropic's current Claude Code
# release: a no-op while the channel matches the pin, otherwise it opens a
# branch and lets auto-merge land it once CI is green. release-tag.yaml then
# tags the merge and publishes. The bump must be the only thing in its release,
# so the run fails when main carries commits the last tag does not cover;
# release those first.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-claude
  cancel-in-progress: false

jobs:
  bump:
    name: bump and open pull request
    runs-on: ubuntu-latest
    # Holds the app credentials; the branch policy limits them to main, so a
    # workflow on any other ref is refused them. deployment: false because this
    # is a secret boundary, not a deployment.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    env:
      # Anthropic's soaked channel: these releases publish themselves, so the
      # bump is never reviewed by a person before it goes out.
      CHANNEL: stable
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve the channel
        id: bump
        run: |
          out="$(./hack/bump-claude.sh "$CHANNEL")"
          read -r old new <<<"$out"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$old" = "$new" ]; then
            echo "$CHANNEL is at $old; nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Next patch version
        id: next
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          branch="chore/claude-$NEW"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" != 0 ]; then
            echo "a pull request for $NEW is already open; waiting for it to land"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # grep finds nothing on a repo without tags: keep the pipeline green
          # and report the empty result below.
          last="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -z "$last" ]; then
            echo "no vX.Y.Z tag yet: cut the first release by hand" >&2; exit 1
          fi
          pre="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-' | sed 's/-.*//' | sort -V | tail -1 || true)"
          if [ -n "$pre" ] && [ "$(printf '%s\n%s\n' "$last" "$pre" | sort -V | tail -1)" != "$last" ]; then
            echo "pre-release tags ahead of $last: finish that release first" >&2; exit 1
          fi
          if ! git merge-base --is-ancestor "$last" HEAD; then
            echo "$last is not an ancestor of main" >&2; exit 1
          fi
          ahead="$(git rev-list --count "$last"..HEAD)"
          if [ "$ahead" != 0 ]; then
            git log --oneline "$last"..HEAD >&2
            echo "main has $ahead commit(s) since $last; release them before the Claude bump" >&2
            exit 1
          fi
          IFS=. read -r x y z <<<"${last#v}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "version=$x.$y.$((z + 1))" >> "$GITHUB_OUTPUT"
      - name: Build both images and smoke-test the binary
        if: steps.bump.outputs.skip != 'true' && steps.next.outputs.skip != 'true'
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          docker build -f images/orchestrator/Dockerfile -t shock:bump .
          docker build -f images/runner/Dockerfile -t shock-runner:bump .
          ./hack/smoke-claude.sh shock:bump "$NEW"
          ./hack/smoke-claude.sh shock-runner:bump "$NEW"
      # createCommitOnBranch rather than git commit: GitHub signs the commit it
      # creates, and expectedHeadOid refuses it if main moved during the run.
      - name: Open the pull request
        if: steps.bump.outputs.skip != 'true' && steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OLD: ${{ steps.bump.outputs.old }}
          NEW: ${{ steps.bump.outputs.new }}
          BRANCH: ${{ steps.next.outputs.branch }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          head="$(git rev-parse HEAD)"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${BRANCH}" -f "sha=${head}" --jq .ref
          additions="$(for f in images/orchestrator/Dockerfile images/runner/Dockerfile charts/shock/Chart.yaml; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" '{path: $path, contents: $contents}'
          done | jq -s .)"
          jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg headline "chore: bump Claude Code to $NEW (from $OLD)" \
            --arg oid "$head" \
            --argjson additions "$additions" \
            '{query: $query, variables: {input: {
               branch: {repositoryNameWithOwner: $repo, branchName: $branch},
               message: {headline: $headline},
               expectedHeadOid: $oid,
               fileChanges: {additions: $additions}}}}' > commit.json
          gh api graphql --input commit.json --jq .data.createCommitOnBranch.commit.oid
          cat > body.md <<EOF
          Pins both images to Claude Code **$NEW** (was $OLD), the \`$CHANNEL\` channel of Anthropic's release bucket.

          Both images were built and smoke-tested in the workflow run before this branch was opened. Auto-merge is armed: once the required checks pass this lands on \`main\`, and \`release-tag.yaml\` tags it \`v$VERSION\` and publishes.

          Changelog: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
          EOF
          url="$(gh pr create --base main --head "$BRANCH" \
            --title "chore: bump Claude Code to $NEW" --body-file body.md)"
          gh pr merge --auto --squash "$url"
          echo "$url"
