version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gosec
    - errorlint
    - gocritic
    - revive
  settings:
    gosec:
      excludes:
        - G304 # file paths come from trusted env (the orchestrator) by design
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yuriyostapenko/shock
