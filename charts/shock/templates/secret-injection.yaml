{{- if .Values.secretInjection.enabled }}
{{- $si := .Values.secretInjection }}
{{- $injected := include "shock.injectedCredentials" . | fromJsonArray }}
{{- if eq $si.pki "managed" }}
{{- $cm := $si.certManager }}
{{- $labels := dict "root" . "component" "egress-pki" }}
---
# A self-signed issuer exists only to sign the interception CA below.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "shock.egressSelfSignedIssuerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shock.labels" $labels | nindent 4 }}
  {{- with $cm.issuerAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selfSigned: {}
---
# The interception CA. Its private key stays in this Secret, which no Pod the
# chart renders ever references (spec section 9).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "shock.egressCAName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shock.labels" $labels | nindent 4 }}
spec:
  isCA: true
  commonName: {{ printf "%s egress interception CA" (include "shock.fullname" .) | quote }}
  secretName: {{ include "shock.egressCAName" . }}
  duration: {{ $cm.caDuration | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ include "shock.egressSelfSignedIssuerName" . }}
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "shock.egressCAName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shock.labels" $labels | nindent 4 }}
  {{- with $cm.issuerAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ca:
    secretName: {{ include "shock.egressCAName" . }}
---
# What Cilium presents to the runner. dnsNames are exactly the injected hosts,
# so adding a credential reissues the certificate with the new SAN.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "shock.egressCertName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shock.labels" $labels | nindent 4 }}
spec:
  secretName: {{ include "shock.egressCertName" . }}
  duration: {{ $cm.certDuration | quote }}
  renewBefore: {{ $cm.certRenewBefore | quote }}
  usages:
    - server auth
  dnsNames:
    {{- range $injected }}
    - {{ .host | quote }}
    {{- end }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ include "shock.egressCAName" . }}
    kind: Issuer
    group: cert-manager.io
{{- end }}
{{- if and (ne $si.pki "managed") $si.ca.bundle }}
{{- $labels := dict "root" . "component" "egress-ca-bundle" }}
---
# Public certificate of the operator's interception CA, mounted read-only into
# every runner. Never the private key: the chart has no use for it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shock.componentName" $labels }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shock.labels" $labels | nindent 4 }}
data:
  ca.crt: |
    {{- $si.ca.bundle | nindent 4 }}
{{- end }}
{{- if not $si.upstreamCA.existingSecret.name }}
{{- $labels := dict "root" . "component" "upstream-ca" }}
---
# Public roots Cilium verifies the real host against (originatingTLS): Mozilla's
# CA list as curl.se publishes it, pinned by the digest in the file's header.
# Cilium accepts a Secret only, hence not a ConfigMap. Override the whole thing
# with secretInjection.upstreamCA.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shock.componentName" $labels }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shock.labels" $labels | nindent 4 }}
  annotations:
    shock.invalid/upstream-ca-source: "https://curl.se/ca/cacert.pem"
type: Opaque
stringData:
  ca.crt: |
    {{- .Files.Get "files/upstream-ca-bundle.pem" | nindent 4 }}
{{- end }}
{{- if $si.clientConfigs }}
{{- $labels := dict "root" . "component" "registries" }}
---
# Placeholder client configs, mounted read-only at /etc/shock/registries. They
# carry no credential; shock.validateSecretInjection rejects one that names a
# credential Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shock.componentName" $labels }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shock.labels" $labels | nindent 4 }}
data:
  {{- range $file, $body := $si.clientConfigs }}
  {{ $file }}: |
    {{- $body | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
