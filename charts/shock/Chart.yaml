apiVersion: v2
name: shock
description: >-
  Self-Hosted Orchestrator for Claude on Kubernetes: on-demand Claude Code
  self-hosted runners with a persistent per-session workspace that survives
  suspension. Requires the upstream agent-sandbox controller (not installed
  by this chart).
type: application
# version and appVersion are set from the git tag by the release workflow
# (helm package --version X.Y.Z --app-version X.Y.Z).
version: 0.0.0-dev
appVersion: 0.0.0-dev
# Derived, not invented: agent-sandbox v1.0.2 pins k8s.io/* v0.37; two minors
# below is 1.35 (upstream's supported skew). Re-derive on every agent-sandbox bump.
kubeVersion: ">=1.35.0-0"
home: https://github.com/yuriyostapenko/shock
sources:
  - https://github.com/yuriyostapenko/shock
  - https://github.com/kubernetes-sigs/agent-sandbox
keywords:
  - claude
  - claude-code
  - self-hosted-runner
  - agent-sandbox
annotations:
  # Claude Code release bundled in both images, so `helm show chart` answers it
  # without pulling one; hack/bump-claude.sh keeps it equal to
  # ARG CLAUDE_CODE_VERSION in images/*/Dockerfile.
  shock.invalid/claude-code-version: "2.1.270"
