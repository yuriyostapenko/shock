# e2e values: a busybox fake runner that records each order on the PVC and
# sleeps/exits as its work order says. The test invokes the hook directly.
environment:
  existingSecret: e2e-environment
orchestrator:
  image:
    repository: shock-e2e/controller
    tag: dev
    pullPolicy: Never
  replicas: 0
  pdb:
    enabled: false
sessionController:
  resyncSeconds: 30
  gc:
    enabled: true
    maxIdleAge: 336h
    maxIdleSessions: 20
  zombie:
    enabled: true
    alertAfter: 1m
runner:
  image:
    repository: docker.io/library/busybox
    tag: "1.38"
  terminationGracePeriodSeconds: 20
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {memory: 128Mi}
  command: ["sh", "-c"]
  args:
    - |
      set -u
      wo=/var/run/claude/work-order/work-order
      # The synthetic work order is a shell fragment: SLEEP=.. EXIT=.. ORDER=..
      eval "$(cat "$wo")"
      mkdir -p /workspace/marks
      echo "$(hostname) $(cat "$wo")" >> /workspace/marks/log
      echo "$ORDER" > /workspace/marks/last-order
      i=0; while [ "$i" -lt "${SLEEP:-10}" ]; do sleep 1; i=$((i+1)); done
      exit "${EXIT:-0}"
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: ["ALL"]
  podSecurityContext:
    fsGroup: 65534
  baseDir: /workspace
  storage:
    mountPath: /workspace
    size: 100Mi
    # kind's local-path provisioner cannot enforce RWOP; e2e asserts the mode only.
    accessMode: ReadWriteOnce
network:
  mode: none
monitoring:
  enabled: false
